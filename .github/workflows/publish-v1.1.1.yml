name: Publish v1.1.1

on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-v1.1.1.yml]

permissions:
  contents: write

concurrency:
  group: publish-v1.1.1
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'etetet94/just-volleyball-zh-tw' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_REPO: etetet94/just-volleyball-zh-tw
      TAG: v1.1.1
      RELEASE_COMMIT: 8b029768b2ae1f76c03d441a9edf3288b003bab6
      PACKAGE: JustVolleyball-zhTW-v1.1.1.zip
      EXPECTED_SHA256: c7589fc678735c32051993f09b28d5e27c9138a55e91b7d6a7b027d66e3cdcd5
    steps:
      - name: Download and verify the versioned package
        shell: bash
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          base="https://raw.githubusercontent.com/$GH_REPO/$SOURCE_COMMIT"
          curl --fail --location --retry 3 "$base/downloads/$PACKAGE" --output "$PACKAGE"
          curl --fail --location --retry 3 "$base/downloads/SHA256SUMS.txt" --output SHA256SUMS.txt
          curl --fail --location --retry 3 "$base/docs/releases/v1.1.1.md" --output INSTALL-AND-CHANGELOG-zhTW.md
          tr -d '\r' < SHA256SUMS.txt | sha256sum --check -
          printf '%s  %s\n' "$EXPECTED_SHA256" "$PACKAGE" | sha256sum --check -

      - name: Attach assets and publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GH_REPO" \
              --target "$RELEASE_COMMIT" --draft \
              --title 'v1.1.1｜繁中介面、六種擊打特效與全員撲倒統計' \
              --notes-file INSTALL-AND-CHANGELOG-zhTW.md
          fi

          draft="$(gh release view "$TAG" --repo "$GH_REPO" --json isDraft --jq '.isDraft')"
          for file in "$PACKAGE" SHA256SUMS.txt INSTALL-AND-CHANGELOG-zhTW.md; do
            assets="$(gh release view "$TAG" --repo "$GH_REPO" --json assets --jq '.assets[].name')"
            if printf '%s\n' "$assets" | grep -Fqx "$file"; then
              mkdir -p remote-assets
              gh release download "$TAG" --repo "$GH_REPO" --pattern "$file" --dir remote-assets
              cmp "$file" "remote-assets/$file"
            elif [ "$draft" = true ]; then
              gh release upload "$TAG" "$file" --repo "$GH_REPO"
            else
              echo "Published release is missing $file; refusing to change an existing published release."
              exit 1
            fi
          done

          if [ "$draft" = true ]; then
            gh release edit "$TAG" --repo "$GH_REPO" \
              --notes-file INSTALL-AND-CHANGELOG-zhTW.md --draft=false --latest
          fi
          gh release view "$TAG" --repo "$GH_REPO" --json url,tagName,isDraft,assets
