name: Publish v1.0.0

on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-v1.0.0.yml]

permissions:
  contents: write

concurrency:
  group: publish-v1.0.0
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'etetet94/just-volleyball-zh-tw'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_REPO: etetet94/just-volleyball-zh-tw
      TAG: v1.0.0
      RELEASE_COMMIT: 5fb81747039a6c387ebd14d8c249ca84acd01381
      PACKAGE: JustVolleyball-zhTW-v1.0.0.zip
      EXPECTED_SHA256: 8bde0c1eecf8f1cd0db37a64c9bc1329af6197b10c494f1840ca512a4bd78828
    steps:
      - name: Download and verify the versioned package
        shell: bash
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          base="https://raw.githubusercontent.com/$GH_REPO/$SOURCE_COMMIT"
          curl --fail --location --retry 3 "$base/downloads/$PACKAGE" --output "$PACKAGE"
          curl --fail --location --retry 3 "$base/downloads/SHA256SUMS.txt" --output SHA256SUMS.txt
          curl --fail --location --retry 3 "$base/docs/releases/v1.0.0.md" --output release-notes.md
          sha256sum --check SHA256SUMS.txt
          printf '%s  %s\n' "$EXPECTED_SHA256" "$PACKAGE" | sha256sum --check -

      - name: Attach assets and publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GH_REPO" \
              --target "$RELEASE_COMMIT" --draft \
              --title 'v1.0.0｜just volleyball 繁體中文模組' \
              --notes-file release-notes.md
          fi

          draft="$(gh release view "$TAG" --repo "$GH_REPO" --json isDraft --jq '.isDraft')"
          for file in "$PACKAGE" SHA256SUMS.txt; do
            assets="$(gh release view "$TAG" --repo "$GH_REPO" --json assets --jq '.assets[].name')"
            if printf '%s\n' "$assets" | grep -Fqx "$file"; then
              mkdir -p remote-assets
              gh release download "$TAG" --repo "$GH_REPO" --pattern "$file" --dir remote-assets
              cmp "$file" "remote-assets/$file"
            elif [ "$draft" = true ]; then
              gh release upload "$TAG" "$file" --repo "$GH_REPO"
            else
              echo "Published release is missing $file; refusing to change a published release automatically."
              exit 1
            fi
          done

          if [ "$draft" = true ]; then
            gh release edit "$TAG" --repo "$GH_REPO" \
              --notes-file release-notes.md --draft=false --latest
          fi
          gh release view "$TAG" --repo "$GH_REPO" --json url,tagName,isDraft,assets
